name: Release connector

on:
  push:
    tags:
      - 'netease-v*'
      - 'kugou-v*'
      - 'qqmusic-v*'
      - 'folia-v*'

permissions:
  contents: write

concurrency:
  group: connector-catalog
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve connector metadata
        id: metadata
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^(netease|kugou|qqmusic|folia)-v(.+)$') {
            throw "Unsupported release tag: $tag"
          }

          $id = $Matches[1]
          $version = $Matches[2]
          $projectName = switch ($id) {
            'netease' { 'Netease' }
            'kugou' { 'Kugou' }
            'qqmusic' { 'QQMusic' }
            'folia' { 'Folia' }
          }
          $runtime = if ($id -eq 'netease') { 'win-x64' } else { 'win-x86' }
          $versionPattern = switch ($id) {
            'netease' { '^\d+\.\d+\.\d+\.\d+\.\d+$' }
            'kugou' { '^\d+\.\d+\.\d+\.\d+$' }
            'qqmusic' { '^\d+\.\d+\.\d+$' }
            'folia' { '^\d+\.\d+\.\d+$' }
          }
          if ($version -notmatch $versionPattern) {
            throw "Invalid $id connector version: $version"
          }
          $frameworkAsset = "awoo-connector-$id-$version-$runtime-framework-dependent.zip"
          $assemblyVersion = $version
          if ($id -eq 'netease') {
            $parts = $version -split '\.'
            if ($parts.Count -ne 5) {
              throw "NetEase catalog version must be player major.minor.patch.build plus connector revision: $version"
            }
            $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).$($parts[4])"
          }

          "id=$id" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "project_name=$projectName" >> $env:GITHUB_OUTPUT
          "framework_asset=$frameworkAsset" >> $env:GITHUB_OUTPUT
          "runtime=$runtime" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned CEF 4472 headers
        if: steps.metadata.outputs.id == 'netease'
        uses: actions/checkout@v6
        with:
          repository: chromiumembedded/cef
          ref: 04c8d5653ca5b3e36b693d871cce1ef09617bfc9
          path: .tmp/cef-4472-source
          sparse-checkout: include
          persist-credentials: false

      - name: Prepare pinned CEF 4472 headers
        if: steps.metadata.outputs.id == 'netease'
        shell: pwsh
        run: |
          $cefRoot = 'native/Netease/cef-4472'
          New-Item -ItemType Directory -Force $cefRoot | Out-Null
          Copy-Item `
            -Recurse `
            -Force `
            '.tmp/cef-4472-source/include' `
            "$cefRoot/include"
          if (-not (Test-Path "$cefRoot/include/cef_browser.h")) {
            throw 'Pinned CEF checkout did not contain include/cef_browser.h.'
          }

          $netBase = "$cefRoot/net/base"
          New-Item -ItemType Directory -Force $netBase | Out-Null
          $netErrorList = "$netBase/net_error_list.h"
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri 'https://raw.githubusercontent.com/chromium/chromium/91.0.4472.164/net/base/net_error_list.h' `
            -OutFile $netErrorList
          $expectedSha256 = '3D0AE9C72E7420C2FD7A963FFB08AF5A9BADE4CFE0CE434B6154E976702053FC'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $netErrorList).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Unexpected Chromium net_error_list.h SHA-256: $actualSha256"
          }

      - name: Publish connector
        shell: pwsh
        run: |
          $id = '${{ steps.metadata.outputs.id }}'
          $projectName = '${{ steps.metadata.outputs.project_name }}'
          $version = '${{ steps.metadata.outputs.version }}'
          $frameworkOutput = "artifacts/$id/framework-dependent"

          dotnet publish `
            "src/$projectName/BiliNCM.Connector.$projectName.csproj" `
            -c Release `
            -r "${{ steps.metadata.outputs.runtime }}" `
            --self-contained false `
            -p:SelfContained=false `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:UseAppHost=true `
            -p:Version="${{ steps.metadata.outputs.assembly_version }}" `
            -p:InformationalVersion="$version" `
            -o "$frameworkOutput"

          $frameworkExecutable = "$frameworkOutput/Awoo.Connector.$projectName.exe"
          $frameworkAssembly = "$frameworkOutput/Awoo.Connector.$projectName.dll"
          if (-not (Test-Path $frameworkExecutable) -or -not (Test-Path $frameworkAssembly)) {
            throw 'Framework-dependent publish did not contain its apphost and managed entry assembly.'
          }

      - name: Set up .NET x86 for connector smoke test
        if: steps.metadata.outputs.runtime == 'win-x86'
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-x86
        with:
          dotnet-version: '8.0.x'
          architecture: x86

      - name: Smoke framework-dependent connector
        shell: pwsh
        run: |
          $id = '${{ steps.metadata.outputs.id }}'
          $projectName = '${{ steps.metadata.outputs.project_name }}'
          $runtime = '${{ steps.metadata.outputs.runtime }}'
          $frameworkExecutable = "artifacts/$id/framework-dependent/Awoo.Connector.$projectName.exe"

          if ($runtime -eq 'win-x86') {
            if ([string]::IsNullOrWhiteSpace($env:DOTNET_ROOT)) {
              throw 'x86 setup-dotnet did not export DOTNET_ROOT.'
            }
            $fxrRoot = Join-Path $env:DOTNET_ROOT 'host\fxr'
            if (-not (Test-Path -LiteralPath $fxrRoot)) {
              throw "x86 .NET hostfxr directory is missing: $fxrRoot"
            }
            $net8HostFxr = Get-ChildItem -LiteralPath $fxrRoot -Directory |
              Where-Object Name -Like '8.*' |
              Select-Object -First 1
            if (-not $net8HostFxr) {
              throw "x86 .NET 8 hostfxr is missing below: $fxrRoot"
            }
            $env:DOTNET_ROOT_X86 = $env:DOTNET_ROOT
          }

          node scripts/smoke-connector.mjs `
            "$frameworkExecutable" `
            "$id"

      - name: Package framework-dependent connector
        shell: pwsh
        run: |
          $id = '${{ steps.metadata.outputs.id }}'
          $frameworkOutput = "artifacts/$id/framework-dependent"

          Compress-Archive `
            -Path "$frameworkOutput/*" `
            -DestinationPath "artifacts/${{ steps.metadata.outputs.framework_asset }}" `
            -CompressionLevel Optimal

      - name: Sign framework-dependent release asset
        id: signing
        shell: pwsh
        env:
          CONNECTOR_SIGNING_PRIVATE_KEY: ${{ secrets.CONNECTOR_SIGNING_PRIVATE_KEY }}
        run: |
          $frameworkAsset = "artifacts/${{ steps.metadata.outputs.framework_asset }}"
          $frameworkResult = node scripts/sign-release.mjs "$frameworkAsset" | ConvertFrom-Json
          "framework_sha256=$($frameworkResult.sha256)" >> $env:GITHUB_OUTPUT
          "framework_signature=$($frameworkResult.signature)" >> $env:GITHUB_OUTPUT
          "framework_size=$($frameworkResult.size)" >> $env:GITHUB_OUTPUT
          $frameworkResult.signature | Set-Content -NoNewline "$frameworkAsset.sig"
          $frameworkResult.sha256 | Set-Content -NoNewline "$frameworkAsset.sha256"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $frameworkAsset = "artifacts/${{ steps.metadata.outputs.framework_asset }}"
          gh release create "${{ github.ref_name }}" `
            "$frameworkAsset" `
            "$frameworkAsset.sig" `
            "$frameworkAsset.sha256" `
            --title "${{ steps.metadata.outputs.id }} connector v${{ steps.metadata.outputs.version }}" `
            --notes "Awoo MusicBot ${{ steps.metadata.outputs.id }} connector v${{ steps.metadata.outputs.version }}. This forward v2 release contains only the signed Awoo framework-dependent package. Existing v1 releases remain available for older cores."

      - name: Prewarm connector assets in R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ENKIANSSUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 48a310efe84107a68b7ea095719805bb
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw 'ENKIANSSUS_CLOUDFLARE_API_TOKEN is required for R2 prewarm.'
          }

          $wranglerVersion = '4.125.0'
          $bucket = 'awoo-download-cache'
          $releasePrefix = "github-release-v1/github.com/Enkianssus/awoo-connectors/releases/download/${{ github.ref_name }}"
          $cacheControl = 'public, max-age=31536000, immutable'
          $assetPaths = @(
            "artifacts/${{ steps.metadata.outputs.framework_asset }}",
            "artifacts/${{ steps.metadata.outputs.framework_asset }}.sig",
            "artifacts/${{ steps.metadata.outputs.framework_asset }}.sha256"
          )

          foreach ($assetPath in $assetPaths) {
            $asset = Get-Item -LiteralPath $assetPath
            $contentType = switch ($asset.Extension.ToLowerInvariant()) {
              '.zip' { 'application/zip'; break }
              '.sig' { 'text/plain; charset=utf-8'; break }
              '.sha256' { 'text/plain; charset=utf-8'; break }
              default { 'application/octet-stream' }
            }
            $objectPath = "$bucket/$releasePrefix/$($asset.Name)"
            $contentDisposition = 'attachment; filename="' + $asset.Name + '"'
            $arguments = @(
              '--yes',
              "wrangler@$wranglerVersion",
              'r2',
              'object',
              'put',
              $objectPath,
              '--remote',
              '--file',
              $asset.FullName,
              '--content-type',
              $contentType,
              '--content-disposition',
              $contentDisposition,
              '--cache-control',
              $cacheControl,
              '--force'
            )
            Write-Host "Prewarming R2 object $objectPath"
            & npx.cmd @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "R2 prewarm failed for $($asset.Name) with exit code $LASTEXITCODE"
            }
          }

          $tag = '${{ github.ref_name }}'
          $connectorId = '${{ steps.metadata.outputs.id }}'
          $tagPrefix = "$connectorId-v"
          $versionParts = switch ($connectorId) {
            'netease' { 5 }
            'kugou' { 4 }
            'qqmusic' { 3 }
            'folia' { 3 }
          }
          $releasePrefix = "github-release-v1/github.com/Enkianssus/awoo-connectors/releases/download/$tag"
          $verifyArguments = @(
            'scripts/cleanup-r2-release-cache.mjs',
            '--account-id', $env:CLOUDFLARE_ACCOUNT_ID,
            '--bucket', 'awoo-download-cache',
            '--repository', 'Enkianssus/awoo-connectors',
            '--current-tag', $tag,
            '--tag-prefix', $tagPrefix,
            '--version-parts', [string]$versionParts,
            '--dry-run'
          )
          foreach ($assetPath in $assetPaths) {
            $assetName = [System.IO.Path]::GetFileName($assetPath)
            $verifyArguments += @('--expected-key', "$releasePrefix/$assetName")
          }
          & node @verifyArguments
          if ($LASTEXITCODE -ne 0) {
            throw "R2 upload verification failed for connector release $tag with exit code $LASTEXITCODE"
          }

      - name: Update forward v2 catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-catalog-v2.mjs `
            "${{ steps.metadata.outputs.id }}" `
            "${{ steps.metadata.outputs.version }}" `
            "${{ steps.metadata.outputs.framework_asset }}" `
            "${{ steps.signing.outputs.framework_sha256 }}" `
            "${{ steps.signing.outputs.framework_signature }}" `
            "${{ steps.signing.outputs.framework_size }}" `
            "${{ steps.metadata.outputs.runtime }}" `
            "8.0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-v2.json
          git commit -m "Update ${{ steps.metadata.outputs.id }} connector v2 catalog"
          git push origin main

      - name: Clean old connector R2 objects
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ENKIANSSUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 48a310efe84107a68b7ea095719805bb
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw 'ENKIANSSUS_CLOUDFLARE_API_TOKEN is required for R2 cleanup.'
          }

          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^(netease|kugou|qqmusic|folia)-v(?:\d+\.)+\d+$') {
            throw "Unsupported connector release tag for R2 cleanup: $tag"
          }
          $connectorId = $Matches[1]
          $tagPrefix = "$connectorId-v"
          $versionParts = switch ($connectorId) {
            'netease' { 5 }
            'kugou' { 4 }
            'qqmusic' { 3 }
            'folia' { 3 }
          }
          $releasePrefix = "github-release-v1/github.com/Enkianssus/awoo-connectors/releases/download/$tag"
          $assetPaths = @(
            "artifacts/${{ steps.metadata.outputs.framework_asset }}",
            "artifacts/${{ steps.metadata.outputs.framework_asset }}.sig",
            "artifacts/${{ steps.metadata.outputs.framework_asset }}.sha256"
          )
          $arguments = @(
            'scripts/cleanup-r2-release-cache.mjs',
            '--account-id', $env:CLOUDFLARE_ACCOUNT_ID,
            '--bucket', 'awoo-download-cache',
            '--repository', 'Enkianssus/awoo-connectors',
            '--current-tag', $tag,
            '--tag-prefix', $tagPrefix,
            '--version-parts', [string]$versionParts
          )
          foreach ($assetPath in $assetPaths) {
            $assetName = [System.IO.Path]::GetFileName($assetPath)
            if (-not (Test-Path -LiteralPath $assetPath)) {
              throw "Expected uploaded release asset is missing: $assetPath"
            }
            $arguments += @('--expected-key', "$releasePrefix/$assetName")
          }
          & node @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "R2 cleanup failed for connector release $tag with exit code $LASTEXITCODE"
          }
