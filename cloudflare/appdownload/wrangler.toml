name = "appdownload"
account_id = "48a310efe84107a68b7ea095719805bb"
main = "worker.js"
compatibility_date = "2026-05-12"
workers_dev = true
preview_urls = false

# Durable R2 download cache for prewarmed release assets.
# Without this binding the Worker safely falls back to GitHub proxying.
[[r2_buckets]]
binding = "DOWNLOAD_CACHE"
bucket_name = "awoo-download-cache"

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "bilincm-feedback"
database_id = "304494eb-0c4f-4c88-b445-c830cdd090fa"
migrations_dir = "migrations"
